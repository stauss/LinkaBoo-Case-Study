name: LinkaBoo
options:
  bundleIdPrefix: app.linkaboo
  deploymentTarget:
    macOS: "12.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"

targets:
  LinkaBoo:
    type: application
    platform: macOS
    sources:
      - path: LinkaBooApp
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.linkaboo.LinkaBoo
        INFOPLIST_FILE: LinkaBooApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LinkaBooApp/Resources/LinkaBoo.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    postBuildScripts:
      - name: "Copy Go Binary"
        script: |
          GO_BINARY="${SRCROOT}/../build/linkaboo"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/linkaboo"
          if [ ! -f "$GO_BINARY" ]; then
            echo "warning: Go binary not found. Run 'task go:build' first."
            exit 0
          fi
          cp "$GO_BINARY" "$DEST"
          chmod +x "$DEST"
          # Strip quarantine xattrs and re-sign with the parent app's identity.
          # The Go linker produces its own adhoc signature which macOS will kill
          # (SIGKILL / exit 9) when nested inside a differently-signed app bundle.
          /usr/bin/xattr -c "$DEST" 2>/dev/null || true
          EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST"
        inputFiles:
          - $(SRCROOT)/../build/linkaboo
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/linkaboo
    dependencies:
      - target: SendWithBooFinder
        embed: true

  SendWithBooFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.linkaboo.LinkaBoo.FinderExtension
        INFOPLIST_FILE: FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    frameworks:
      - sdk: FinderSync.framework
